[project]
name = "second-opinion"
version = "0.1.0"
description = "A pull-request reviewer that measures itself: deterministic checks, a model review with structured output, a second pass that verifies every finding, and precision/recall against a labelled eval set."
license = "MIT"
authors = [{ name = "Ilia Muravev", email = "ilia.muravev.dev@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "typer>=0.27,<1",
  "rich>=15,<16",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "httpx>=0.28,<1",
  "anthropic>=1.6,<2",
  "openai>=2,<3",
  "pyyaml>=6,<7",
]

[project.scripts]
second-opinion = "second_opinion.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "respx>=0.22,<1",
  "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_opinion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT", "ANN", "PL", "S"]
ignore = [
  "PLR0913", # explicit pipelines take many arguments
  "PLR0917", # Typer commands take their options positionally
  "PLR2004", # magic numbers in tests and thresholds
  "S101",    # assert is the test idiom
  "S311",    # random is used for seeded sampling, never security
  "ANN401",  # Any is needed for JSON payloads
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "S105", "S106", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["second_opinion"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: talks to a real provider or GitHub (never in CI)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["second_opinion"]
branch = true
